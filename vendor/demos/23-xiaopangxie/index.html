<!doctype html>
<html><head><meta charset="utf-8"><title>小螃蟹 — 我陪你看完这场雨</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
html,body{margin:0;padding:0;background:#171A2E;overflow:hidden;width:1920px;height:1080px}
canvas{display:block}
</style></head>
<body>
<canvas id="C" width="1920" height="1080"></canvas>
<script type="module">
window.DEMO = { width:1920, height:1080, fps:30, duration:10, motionBlur:{samples:1, shutter:0.5} };

const W=1920, H=1080, FPS=30;
const cues = await (await fetch('/demos/23-xiaopangxie/cues.json')).json();
const FR = cues.frames, T = k => FR[k]/FPS, F = n => n/FPS;
const LY = cues.lyrics;

await Promise.all([
  document.fonts.load("900 58px 'Noto Sans SC'", '我陪你看完这场雨'),
  document.fonts.load("700 40px 'Noto Sans SC'", '灯一盏一盏 亮起来'),
  document.fonts.load("400 150px 'ZCOOL KuaiLe'", '小螃蟹'),
  document.fonts.load("400 44px 'Long Cang'", 'XIAO PANG XIE'),
]);
await document.fonts.ready;

const g = document.getElementById('C').getContext('2d');

/* ---------- deterministic helpers ---------- */
const mulberry32 = a => () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,u)=>a+(b-a)*u;
const inv=(a,b,v)=>clamp((v-a)/(b-a||1e-6),0,1);
const ss=(a,b,v)=>{const u=inv(a,b,v);return u*u*(3-2*u);};
const eoc=u=>1-Math.pow(1-clamp(u,0,1),3);
const eoQ=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const eob=u=>{u=clamp(u,0,1);const c=1.70158,c3=c+1;return 1+c3*Math.pow(u-1,3)+c*Math.pow(u-1,2);};
/* 定格节奏：小螃蟹的标志是一拍二/一拍三的抽帧感，而不是丝滑 60fps */
const hold=(t,hz)=>{const s=Math.floor(t*hz);const u=(t*hz)-s;return {v:s/hz,u}};
const HEX=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,u)=>{const A=Array.isArray(a)?a:HEX(a),B=Array.isArray(b)?b:HEX(b);return `rgb(${Math.round(lerp(A[0],B[0],u))},${Math.round(lerp(A[1],B[1],u))},${Math.round(lerp(A[2],B[2],u))})`;};
const sh=(c,a)=>{const A=Array.isArray(c)?c:HEX(c);return `rgba(${A[0]},${A[1]},${A[2]},${a})`;};

/* ---------- palette (取自参考片：低饱和夜色 + 暖窗黄 + 陶土橙) ---------- */
const P = {
  skyTop:'#171A2E', skyMid:'#2C3157', skyLow:'#4A4A72',
  warmTop:'#2A2A44', warmMid:'#5C4A63', warmLow:'#8C6A6E',
  far:'#242A4A', mid:'#2E3760', midLit:'#3A4472',
  win:'#F2C14E', winDim:'#4A4A6E',
  ground:'#232742', groundEdge:'#1B1F36',
  paper:'#E9E3D6', ink:'#2A2230',
  crabO:'#B4623F', crabOInk:'#4E2A18',
  crabP:'#D4819A', crabPInk:'#542E3A',
  sub:'#FFD84D', subInk:'#2A1F12'
};

/* ---------- 纸纹 / 颗粒（预生成一次，逐帧复用） ---------- */
const GRAIN = (()=>{
  const c=document.createElement('canvas'); c.width=c.height=512;
  const x=c.getContext('2d'); const rnd=mulberry32(20261005);
  const img=x.createImageData(512,512); const d=img.data;
  for(let i=0;i<512*512;i++){
    const n=210+Math.round(rnd()*45)-22;
    d[i*4]=n; d[i*4+1]=n-4; d[i*4+2]=n-12; d[i*4+3]=255;
  }
  x.putImageData(img,0,0);
  return c;
})();
const MOTTLE = (()=>{   // 大块水渍/色斑，模拟纸张吸色不均
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d'); const rnd=mulberry32(777);
  for(let i=0;i<26;i++){
    const cx=rnd()*W, cy=rnd()*H, r=180+rnd()*420;
    const gr=x.createRadialGradient(cx,cy,0,cx,cy,r);
    const dark=rnd()>.5;
    gr.addColorStop(0, dark?'rgba(20,16,30,0.055)':'rgba(255,240,215,0.045)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gr; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill();
  }
  return c;
})();

/* ---------- 手绘感工具：多边形顶点轻微抖动 + 定时重抖（boil） ---------- */
function wobble(pts, seed, amp){
  const r=mulberry32(seed);
  return pts.map(([x,y])=>[x+(r()-.5)*amp*2, y+(r()-.5)*amp*2]);
}
function poly(x, pts, fill, stroke, lw){
  x.beginPath(); pts.forEach(([px,py],i)=> i?x.lineTo(px,py):x.moveTo(px,py)); x.closePath();
  if(fill){ x.fillStyle=fill; x.fill(); }
  if(stroke){ x.strokeStyle=stroke; x.lineWidth=lw||3; x.lineJoin='round'; x.stroke(); }
}
/* 圆角矩形，可选手绘抖动 */
function rrect(x, X,Y,w,h,r,fill,stroke,lw,seed,amp){
  const k=seed?(s=>mulberry32(seed)()):null;
  const rad=Math.min(r, w/2, h/2);
  x.beginPath();
  const seg=6;
  const jitter=()=> (k? (k()-.5)*(amp||0)*2 : 0);
  x.moveTo(X+rad, Y+jitter());
  x.lineTo(X+w-rad, Y+jitter());
  x.quadraticCurveTo(X+w, Y, X+w, Y+rad+jitter());
  x.lineTo(X+w, Y+h-rad+jitter());
  x.quadraticCurveTo(X+w, Y+h, X+w-rad, Y+h+jitter());
  x.lineTo(X+rad, Y+h+jitter());
  x.quadraticCurveTo(X, Y+h, X, Y+h-rad+jitter());
  x.lineTo(X, Y+rad+jitter());
  x.quadraticCurveTo(X, Y, X+rad, Y+jitter());
  x.closePath();
  if(fill){ x.fillStyle=fill; x.fill(); }
  if(stroke){ x.strokeStyle=stroke; x.lineWidth=lw||3; x.lineJoin='round'; x.stroke(); }
}

/* ---------- 小螃蟹本体：宽扁壳 + 两侧肩角 + 4 条短腿 ---------- */
/* o = {x, y(脚底线), s, color, ink, flip, bob, lean, walk, eye('chevron'|'happy'|'dot'),
       blush, flower, dim, seed, arm} */
function crab(x, o){
  const s=o.s||1, w=118*s, h=72*s;
  const bx=o.x - w/2, by=o.y - h - 22*s + (o.bob||0);
  x.save();
  if(o.flip){ x.translate(o.x,0); x.scale(-1,1); x.translate(-o.x,0); }
  if(o.lean){ x.translate(o.x, o.y); x.rotate(o.lean); x.translate(-o.x,-o.y); }

  const sd=(o.seed||1)*97;
  const col=o.color, ink=o.ink;

  // 腿（先画，被身体压住）：4 条，两两成对
  const walk=o.walk||[0,0,0,0];
  const legs=[[.16,0],[.30,1],[.70,2],[.84,3]];
  legs.forEach(([u,i])=>{
    const lw=12*s, lh=(26+walk[i]*8)*s;
    const lx=bx+w*u-lw/2, ly=by+h-2*s;
    rrect(x, lx, ly, lw, lh, 3*s, col, ink, 2.6*s, sd+i*13, 0.7*s);
  });

  // 手臂（可选）：细杆 + 小手
  if(o.arm){
    [[-1,.18],[1,.82]].forEach(([dir,u])=>{
      const ax=bx+w*(u), ay=by+h*0.34;
      const sw=(o.armSwing||0)*dir;
      x.save(); x.translate(ax,ay); x.rotate(sw);
      rrect(x, -5*s, 0, 10*s, 26*s, 4*s, col, ink, 2.4*s, sd+40+dir*7, 0.6*s);
      x.beginPath(); x.arc(0, 28*s, 7*s, 0, Math.PI*2); x.fillStyle=col; x.fill();
      x.strokeStyle=ink; x.lineWidth=2.4*s; x.stroke();
      x.restore();
    });
  }

  // 壳顶两侧的肩角（螃蟹壳的宽沿）——参考片里这对「耳朵」是辨识关键
  rrect(x, bx-17*s, by-3*s, w+34*s, 21*s, 6*s, col, ink, 3.4*s, sd+5, 0.9*s);
  // 身体
  rrect(x, bx, by+11*s, w, h-11*s, 9*s, col, ink, 3*s, sd+9, 0.9*s);

  // 高光面：右侧一条浅色竖带，模拟体积
  x.save();
  x.beginPath(); x.rect(bx+w*0.70, by+14*s, w*0.22, h-18*s); x.clip();
  x.fillStyle='rgba(255,246,230,0.13)'; x.fillRect(bx+w*0.70, by+14*s, w*0.22, h-18*s);
  x.restore();

  // 表情
  const ex1=bx+w*0.30, ex2=bx+w*0.70, ey=by+h*0.52, es=15*s;
  x.strokeStyle=ink; x.lineWidth=5.2*s; x.lineCap='round'; x.lineJoin='round';
  const blink=o.blink||0;
  if(blink>0.5){
    [ex1,ex2].forEach(cx=>{ x.beginPath(); x.moveTo(cx-es*0.8, ey); x.lineTo(cx+es*0.8, ey); x.stroke(); });
  } else if(o.eye==='chevron'){
    x.beginPath(); x.moveTo(ex1-es*0.7, ey-es*0.75); x.lineTo(ex1+es*0.55, ey); x.lineTo(ex1-es*0.7, ey+es*0.75); x.stroke();
    x.beginPath(); x.moveTo(ex2+es*0.7, ey-es*0.75); x.lineTo(ex2-es*0.55, ey); x.lineTo(ex2+es*0.7, ey+es*0.75); x.stroke();
  } else if(o.eye==='happy'){
    [ex1,ex2].forEach(cx=>{ x.beginPath(); x.arc(cx, ey+es*0.35, es*0.72, Math.PI*1.15, Math.PI*1.85); x.stroke(); });
  } else {
    [ex1,ex2].forEach(cx=>{ x.beginPath(); x.arc(cx, ey, es*0.34, 0, Math.PI*2); x.fillStyle=ink; x.fill(); });
  }
  if(o.blush){
    x.fillStyle='rgba(230,120,140,0.42)';
    [bx+w*0.17, bx+w*0.83].forEach(cx=>{ x.beginPath(); x.ellipse(cx, ey+es*0.9, es*0.62, es*0.36, 0,0,Math.PI*2); x.fill(); });
  }
  // 嘴
  if(o.mouth==='o'){ x.beginPath(); x.arc(bx+w*0.5, ey+es*1.55, es*0.34, 0, Math.PI*2); x.fillStyle=ink; x.fill(); }
  else if(o.mouth==='smile'){ x.beginPath(); x.arc(bx+w*0.5, ey+es*1.15, es*0.5, Math.PI*0.15, Math.PI*0.85); x.stroke(); }

  // 头顶小花
  if(o.flower){
    const fx=bx+w*0.62, fy=by-2*s;
    x.save(); x.translate(fx,fy); x.rotate(o.flowerRot||0);
    for(let i=0;i<5;i++){ x.beginPath(); x.ellipse(0,-9*s,5.2*s,8*s, i*Math.PI*2/5, 0, Math.PI*2); x.fillStyle=P.paper; x.fill(); x.strokeStyle=ink; x.lineWidth=2.2*s; x.stroke(); }
    x.beginPath(); x.arc(0,0,4.2*s,0,Math.PI*2); x.fillStyle=P.win; x.fill(); x.strokeStyle=ink; x.lineWidth=2.2*s; x.stroke();
    x.restore();
  }
  x.restore();
}

/* ---------- 场景生成（确定性） ---------- */
const STARS=(()=>{const r=mulberry32(11);return Array.from({length:90},()=>[r()*W, 40+r()*420, 0.6+r()*1.7, r()*6.28]);})();
const CLOUDS=(()=>{const r=mulberry32(23);return Array.from({length:5},(_,i)=>({x:r()*W, y:120+i*70+r()*60, s:0.7+r()*0.9, v:8+r()*14, seed:r()*1e4}));})();
const RAIN=(()=>{const r=mulberry32(41);return Array.from({length:230},()=>({x:r()*W, y:r()*H, len:12+r()*20, sp:640+r()*480, w:1.0+r()*0.9}));})();
const FAR=(()=>{const r=mulberry32(57);const a=[];let x=-60;while(x<W+80){const w=48+r()*92, h=90+r()*180;a.push([x,w,h]);x+=w+8+r()*22;}return a;})();
const MID=(()=>{const r=mulberry32(63);const a=[];let x=-40;while(x<W+60){const w=86+r()*118, h=170+r()*260;a.push([x,w,h]);x+=w+14+r()*26;}return a;})();
const WINDOWS=(()=>{const r=mulberry32(91);const a=[];
  MID.forEach(([bx,bw,bh],bi)=>{
    const cols=Math.max(2,Math.floor(bw/34)), rows=Math.max(3,Math.floor(bh/44));
    for(let c=0;c<cols;c++)for(let e=0;e<rows;e++){
      if(r()<0.30) continue;
      const wx=bx+12+c*(bw-24)/cols, wy=H-232-bh+22+e*(bh-40)/rows;
      a.push({x:wx, y:wy, w:12, h:16, t:0, seed:r()*1000});
    }
  });
  return a;
})();

/* ---------- 时间线 ---------- */
const tHook=T('hook'), tRain=T('rain'), tPink=T('pink_in'), tTog=T('together'), tFlower=T('flower'),
      tMoon=T('moon'), tHearts=T('hearts'), tLights=T('lights'), tHold=T('hold'), tEnd=T('end');

/* 两只小螃蟹的走位：从画外走进，并肩站定 */
function crabPose(t){
  const dur=1.15;
  const uOrange=clamp((t-tRain)/dur,0,1), uPink=clamp((t-tPink)/dur,0,1);
  // 位置：右侧走入 → 中间偏左/偏右
  const x1=lerp(2400, 800, eoc(uOrange));
  const x2=lerp(2480, 1090, eoc(uPink));
  const arriving = (u)=> u>0 && u<1;
  // 走路的腿序（定格抽帧）
  const st=hold(t, 11), walkPhase=st.v*11;
  const legs = i => Math.sin(walkPhase*Math.PI + i*Math.PI/2);
  const moving = u=> (u>0&&u<0.98)?1:0;
  const m1=moving(uOrange), m2=moving(uPink);
  const bobAmp = 7.5;
  const bob1 = m1 * Math.abs(Math.sin(walkPhase*Math.PI)) * -bobAmp;
  const bob2 = m2* Math.abs(Math.sin(walkPhase*Math.PI+0.6))* -bobAmp;
  const idle = Math.sin(t*2.1)*1.5 + Math.sin(t*0.9)*0.8;
  const lean1 = m1? Math.sin(walkPhase*Math.PI)*0.028 : Math.sin(t*1.3)*0.008;
  const lean2 = m2? Math.sin(walkPhase*Math.PI+0.6)*0.028 : Math.sin(t*1.1+1)*0.008;

  const look = ss(tTog-0.2, tTog+0.7, t);           // 转头/抬头
  return {
    c1:{ x:x1, y:902, s:1.78, walk:[m1?legs(0):0,m1?legs(1):0,m1?legs(2):0,m1?legs(3):0], bob:bob1+idle, lean:lean1,
         blink: (hold(t,3).v%1===0 && t>tTog+1.5)?1:0 },
    c2:{ x:x2, y:910, s:1.70, walk:[m2?legs(1):0,m2?legs(2):0,m2?legs(3):0,m2?legs(0):0], bob:bob2+idle*0.8, lean:lean2,
         blink: (hold(t,3).v%1===0 && t>tTog+1.5)?1:0 },
    look
  };
}

function drawSky(x,t){
  const warm = ss(tLights-1.1, tEnd-0.9, t);            // 雨停后转暖
  const gr=x.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,    mix(P.skyTop, P.warmTop, warm));
  gr.addColorStop(0.52, mix(P.skyMid, P.warmMid, warm));
  gr.addColorStop(1,    mix(P.skyLow, P.warmLow, warm));
  x.fillStyle=gr; x.fillRect(0,0,W,H);

  // 星星：亮度随雨势起伏，忽明忽暗
  const rainFade = 1-ss(tLights-0.6, tEnd-1.2, t);
  STARS.forEach(([sx,sy,sr,ph])=>{
    const tw=0.45+0.55*Math.abs(Math.sin(t*1.6+ph));
    x.globalAlpha=clamp(tw*0.85*rainFade,0,1);
    x.fillStyle='#FFF6DC';
    x.beginPath(); x.arc(sx, sy - ss(0,tEnd,t)*10, sr, 0, Math.PI*2); x.fill();
  });
  x.globalAlpha=1;
}

function drawMoon(x,t){
  const u=ss(tMoon-0.9, tMoon+1.9, t);
  if(u<=0) return;
  const mx=1568, my=lerp(760, 186, eoQ(u)), r=lerp(58,92,u);
  const gr=x.createRadialGradient(mx,my,r*0.3,mx,my,r*4.4);
  gr.addColorStop(0,'rgba(255,240,196,0.42)');
  gr.addColorStop(0.35,'rgba(255,232,180,0.16)');
  gr.addColorStop(1,'rgba(255,232,180,0)');
  x.fillStyle=gr; x.beginPath(); x.arc(mx,my,r*4.4,0,Math.PI*2); x.fill();
  x.fillStyle='#F6E7B4'; x.beginPath(); x.arc(mx,my,r,0,Math.PI*2); x.fill();
  x.fillStyle='rgba(226,206,150,0.5)';
  [[-.3,-.2,.16],[.24,.12,.11],[-.05,.34,.09]].forEach(([a,b,c])=>{ x.beginPath(); x.arc(mx+a*r,my+b*r,r*c,0,Math.PI*2); x.fill(); });
}

function drawClouds(x,t){
  const part=ss(tMoon-1.2, tMoon+0.6, t);              // 月亮出来时云裂开
  CLOUDS.forEach((c,i)=>{
    const cx=(c.x + t*c.v) % (W+700) - 350;
    const cy=c.y - part*(i%2?46:26);
    x.save(); x.globalAlpha=0.9-0.35*part;
    x.fillStyle = i%2 ? 'rgba(60,66,104,0.95)' : 'rgba(72,74,116,0.9)';
    const r=mulberry32(c.seed);
    const puffs=5;
    for(let p=0;p<puffs;p++){
      const px=cx + (p-puffs/2)*78*c.s + (r()-.5)*22;
      const py=cy + (r()-.5)*26;
      x.beginPath(); x.ellipse(px,py,(58+ r()*30)*c.s,(15+r()*10)*c.s,0,0,Math.PI*2); x.fill();
    }
    x.restore();
  });
}

function drawBuildings(x,t){
  // 远景剪影
  x.fillStyle=P.far;
  FAR.forEach(([bx,bw,bh])=> x.fillRect(bx, H-236-bh, bw, bh+40));
  // 中景
  MID.forEach(([bx,bw,bh],i)=>{
    x.fillStyle = i%3===1? P.midLit : P.mid;
    x.fillRect(bx, H-232-bh, bw, bh+30);
    // 楼顶小结构
    if(i%4===0){ x.fillRect(bx+bw*0.3, H-232-bh-16, bw*0.16, 16); }
  });
  // 地标塔剪影（呼应参考片的城市地标）
  (function landmark(){
    const lx=1180, base=H-236, hgt=330;
    x.fillStyle=P.far;
    x.beginPath();
    x.moveTo(lx-30, base); x.lineTo(lx-30, base-hgt*0.62); x.lineTo(lx-13, base-hgt*0.78);
    x.lineTo(lx-13, base-hgt); x.lineTo(lx+13, base-hgt); x.lineTo(lx+13, base-hgt*0.78);
    x.lineTo(lx+30, base-hgt*0.62); x.lineTo(lx+30, base); x.closePath(); x.fill();
    x.fillStyle='rgba(242,193,78,0.55)';
    for(let i=0;i<3;i++) x.fillRect(lx-4, base-hgt+16+i*30, 8, 10);
  })();
  // 窗灯：从 together 之后按中心向两侧波浪点亮，每扇灯有自己的 pop
  WINDOWS.forEach((wi,i)=>{
    const cxN = Math.abs(wi.x - W*0.5)/ (W*0.5);
    const tt = tLights + cxN*1.15 + (wi.seed%100)/100*0.18;
    const u = clamp((t-tt)/0.42, 0, 1);
    const on = u>0;
    if(!on){ x.fillStyle=P.winDim; x.fillRect(wi.x, wi.y, wi.w, wi.h); return; }
    const pop = 1 + 0.5*(eob(u)-1)*1.4;
    const a = 0.55+0.45*Math.min(1,u*1.6);
    x.save(); x.globalAlpha=a;
    x.fillStyle = i%7===0 ? '#FFE49A' : P.win;
    const w2=wi.w*pop, h2=wi.h*pop;
    x.fillRect(wi.x-(w2-wi.w)/2, wi.y-(h2-wi.h)/2, w2, h2);
    x.restore();
  });
}

function drawGround(x,t){
  const gr=x.createLinearGradient(0,H-232,0,H);
  gr.addColorStop(0,P.ground); gr.addColorStop(1,P.groundEdge);
  x.fillStyle=gr; x.fillRect(0,H-232,W,232);
  // 栏杆（参考片的江边/天台栏杆）
  x.strokeStyle='rgba(20,18,34,0.85)'; x.lineWidth=6;
  x.beginPath(); x.moveTo(0,H-300); x.lineTo(W,H-300); x.stroke();
  x.lineWidth=5;
  for(let px=40; px<W; px+=96){ x.beginPath(); x.moveTo(px,H-300); x.lineTo(px,H-232); x.stroke(); }
  // 地面上的湿光反射
  x.save(); x.globalAlpha=0.16+0.1*ss(tLights,tEnd,t);
  const rg=x.createLinearGradient(0,H-232,0,H);
  rg.addColorStop(0,'rgba(255,220,150,0.5)'); rg.addColorStop(1,'rgba(255,220,150,0)');
  x.fillStyle=rg; x.fillRect(0,H-232,W,232); x.restore();
}

function drawRain(x,t){
  const inten = ss(tHook-0.2, tRain+0.5, t) * (1-ss(tLights-0.4, tEnd-1.0, t));
  if(inten<=0.01) return;
  x.save(); x.globalAlpha=0.42*inten; x.strokeStyle='#CBD8F2'; x.lineCap='round';
  RAIN.forEach(r=>{
    const y=(r.y + t*r.sp) % (H+120) - 60;
    const drift = 60*inten;
    x.lineWidth=r.w; x.beginPath();
    x.moveTo(r.x + y*0.08, y); x.lineTo(r.x + y*0.08 - r.len*0.18, y + r.len); x.stroke();
  });
  x.restore();
}

function drawParticles(x,t){
  // 四角星光（从 flower 开始）
  const u=ss(tFlower,tFlower+0.6,t);
  if(u>0){
    const rnd=mulberry32(303);
    for(let i=0;i<26;i++){
      const base=tFlower+0.2+i*0.085;
      const life=clamp((t-base)/1.5,0,1); if(life<=0||life>=1) continue;
      const px=420+rnd()*1080, py=250+rnd()*430;
      const a=Math.sin(life*Math.PI)*0.9, s=(3+rnd()*5)*(0.5+Math.sin(life*Math.PI)*0.8);
      x.save(); x.globalAlpha=a; x.translate(px, py - life*46); x.rotate(life*1.1);
      x.fillStyle='#FFF8E2'; x.beginPath();
      x.moveTo(0,-s); x.quadraticCurveTo(s*0.22,-s*0.22, s,0); x.quadraticCurveTo(s*0.22,s*0.22, 0,s);
      x.quadraticCurveTo(-s*0.22,s*0.22, -s,0); x.quadraticCurveTo(-s*0.22,-s*0.22, 0,-s);
      x.fill(); x.restore();
    }
  }
  // 心形
  const hv=ss(tHearts,tHearts+0.5,t);
  if(hv>0){
    const rnd=mulberry32(909);
    for(let i=0;i<14;i++){
      const base=tHearts+0.15+i*0.14;
      const life=clamp((t-base)/1.7,0,1); if(life<=0||life>=1) continue;
      const px=860+rnd()*220, py=740;
      const a=Math.sin(life*Math.PI), s=(0.8+rnd()*0.7)*Math.min(1,life*4);
      x.save(); x.globalAlpha=a*0.95;
      x.translate(px+(rnd()-.5)*40, py - life*230); x.rotate((rnd()-.5)*0.5 + Math.sin(life*3)*0.12);
      x.scale(s,s);
      x.fillStyle= i%3===0 ? '#F2A0B4' : '#E4738C';
      x.beginPath();
      x.moveTo(0,10); x.bezierCurveTo(-16,-4,-14,-20,0,-13); x.bezierCurveTo(14,-20,16,-4,0,10);
      x.fill();
      x.strokeStyle='rgba(60,30,40,0.55)'; x.lineWidth=2.2; x.stroke();
      x.restore();
    }
  }
}

function drawSubtitle(x,t){
  const line = LY.find(l=> t>=l.t && t<l.out);
  if(!line) return;
  const u=clamp((t-line.t)/0.34,0,1), o=clamp((line.out-t)/0.3,0,1);
  const a=Math.min(eoc(u), o);
  const pop=1+0.055*(eob(u)-1)*2.2;
  x.save();
  x.globalAlpha=a;
  x.textAlign='center'; x.textBaseline='middle';
  const cx=W/2, cy=1018, size=58*pop;
  x.font=`900 ${size}px 'Noto Sans SC', sans-serif`;
  // 字幕底带
  const tw=x.measureText(line.text).width;
  const gr=x.createLinearGradient(0,cy-46,0,cy+46);
  gr.addColorStop(0,'rgba(12,10,20,0)'); gr.addColorStop(0.5,'rgba(12,10,20,0.42)'); gr.addColorStop(1,'rgba(12,10,20,0)');
  x.fillStyle=gr; x.fillRect(cx-tw/2-70, cy-46, tw+140, 92);
  // 描边 + 填充（参考片的黄字深边）
  x.lineWidth=11; x.strokeStyle=P.subInk; x.lineJoin='round';
  x.strokeText(line.text, cx, cy);
  x.fillStyle=P.sub; x.fillText(line.text, cx, cy);
  x.restore();
}

function drawTitle(x,t){
  const u=ss(tHold-0.15, tHold+0.85, t);
  if(u<=0) return;
  x.save();
  x.globalAlpha=u;
  // 压暗
  const gr=x.createRadialGradient(W/2,540,120,W/2,540,1050);
  gr.addColorStop(0,'rgba(10,8,18,0.20)'); gr.addColorStop(1,'rgba(10,8,18,0.72)');
  x.fillStyle=gr; x.fillRect(0,0,W,H);
  // 主标题
  const s=1+0.06*(eob(clamp((t-tHold)/0.7,0,1))-1)*2.4;
  x.textAlign='center'; x.textBaseline='middle';
  x.save(); x.translate(W/2, 560); x.scale(s,s);
  const breathe=1+Math.sin(t*2.4)*0.006;
  x.scale(breathe,breathe);
  x.font="400 168px 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif";
  x.lineWidth=16; x.strokeStyle='#2A2230'; x.lineJoin='round';
  x.strokeText(cues.title.main, 0, 0);
  x.fillStyle='#FFF3D6'; x.fillText(cues.title.main, 0, 0);
  // 副标
  x.font="400 46px 'Long Cang', 'Noto Sans SC', sans-serif";
  x.globalAlpha=u*0.9;
  x.lineWidth=8; x.strokeStyle='#2A2230';
  x.strokeText(cues.title.sub, 0, 122);
  x.fillStyle='#F2C14E'; x.fillText(cues.title.sub, 0, 122);
  x.restore();
  x.restore();
}

/* ---------- 主渲染 ---------- */
window.renderAt = async (t) => {
  const pose=crabPose(t);
  // 定格抖动：整场景每 3 帧轻微重摆，模拟手绘 boil
  const boilSeed=Math.floor(t*10)*7919;
  const boilX=(mulberry32(boilSeed)()-0.5)*1.5;
  const boilY=(mulberry32(boilSeed+13)()-0.5)*1.5;

  g.save();
  g.translate(boilX, boilY);

  drawSky(g,t);
  drawMoon(g,t);
  drawClouds(g,t);
  drawBuildings(g,t);
  drawGround(g,t);
  drawRain(g,t);

  // 两只小螃蟹
  const lookUp=pose.look;
  crab(g,{ x:pose.c1.x, y:pose.c1.y, s:pose.c1.s, color:P.crabO, ink:P.crabOInk,
           walk:pose.c1.walk, bob:pose.c1.bob, lean:pose.c1.lean, eye:'chevron',
           blink:pose.c1.blink, seed:5,
           arm: lookUp>0.3, armSwing:0.5*Math.sin(t*2.2)*lookUp });
  crab(g,{ x:pose.c2.x, y:pose.c2.y, s:pose.c2.s, color:P.crabP, ink:P.crabPInk,
           walk:pose.c2.walk, bob:pose.c2.bob, lean:pose.c2.lean, eye:'happy', blush:1, mouth:'smile',
           flower:1, flowerRot: Math.sin(t*1.7)*0.22, blink:pose.c2.blink, seed:17 });

  // 伞：站在 c2 上方（呼应参考片）
  if(t>tPink+0.9){
    const u=ss(tPink+0.9,tPink+1.5,t);
    const px=pose.c2.x-34, py=pose.c2.y-236+pose.c2.bob;
    g.save(); g.globalAlpha=u;
    g.translate(px,py); g.rotate(Math.sin(t*1.25)*0.035);
    g.scale(0.72,0.72);
    g.fillStyle='#8A5F49';
    g.beginPath();
    g.moveTo(-150,0);
    for(let i=0;i<=6;i++){ const u=i/6; g.lineTo(-150+300*u, -40*Math.sin(u*Math.PI)); }
    g.lineTo(150,0); g.quadraticCurveTo(0,26,-150,0); g.closePath();
    g.fill();
    g.strokeStyle='#3A2A22'; g.lineWidth=4.5; g.lineJoin='round'; g.stroke();
    g.strokeStyle='rgba(58,42,34,0.75)'; g.lineWidth=3;
    for(let i=1;i<6;i++){ const u=i/6; g.beginPath(); g.moveTo(-150+300*u, -40*Math.sin(u*Math.PI)); g.lineTo(-150+300*u, 0); g.stroke(); }
    g.fillStyle='#5A3D30'; g.fillRect(-5,0,10,110);
    g.restore();
  }

  drawParticles(g,t);
  g.restore();

  // 纸张质感：水渍 + 颗粒 + 暗角（不随 boil 抖动，保持稳定）
  g.save();
  g.globalAlpha=0.62; g.drawImage(MOTTLE,0,0);
  g.globalCompositeOperation='overlay';
  g.globalAlpha=0.22;                       // 细颗粒：纸张纤维
  g.fillStyle=g.createPattern(GRAIN,'repeat'); g.fillRect(0,0,W,H);
  g.save(); g.scale(2.1,2.1);               // 粗颗粒：蜡笔齿感
  g.globalAlpha=0.16;
  g.fillStyle=g.createPattern(GRAIN,'repeat'); g.fillRect(0,0,W/2.1,H/2.1);
  g.restore();
  g.restore();

  g.save();
  const vg=g.createRadialGradient(W/2,H/2,420,W/2,H/2,1120);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(8,6,16,0.55)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
  g.restore();

  drawSubtitle(g,t);
  drawTitle(g,t);
};

await window.renderAt(0);
window.__ready = true;
</script>
